analysis:
  backend: simulation.mock_analyzer:MockAnalyzer
  config_path: simulation/analyzer.example.yaml
  timeout_ms: 2000
video:
  source: simulation.sim_video:SimVideoSource
  device: sim
  width: 1920
  height: 1080
  fps: 15
  snapshot:
    settle_s: 0.0
    after_span_s: 2.0
    wait_timeout_s: 15.0
  recorder:
    pre_flip_s: 0.5
    min_duration_s: 5.0
device:
  backend: simulation.sim_device:SimDevice
  options:
    time_scale: 1.0
    tray_duration_s: 0.3
    flip_duration_s: 1.0
    settle_duration_s: 2.0
engine:
  incubation_minutes: 60
  time_scale: 600 # 模拟环境加速；真实设备配置必须设为 1
bootstrap:
  hook: simulation.demo_accounts:DemoAccounts
traceability:
  parser:
    backend: simulation.reagents:SimReagentCodeParser
  registry:
    backend: simulation.reagents:SimReagentRegistry
  government:
    backend: simulation.reagents:SimTraceabilityClient
security:
  key_protection: auto
  integrity_check: true
