# MockAnalyzer 的配置，传给 GelAnalyzer.load。全部为可选项。
scripted: false          # true：按下面的场景给出状态，而不是测量图像
seed: 0
state_ratios: [0.5, 0.2, 0.3]   # 完全凝固 / 部分凝固 / 未凝固
tube_states:             # 按管号指定状态（脚本化模式使用）；null 表示没有试管
  1: fully_gelled
  7: partially_gelled
  8: not_gelled
tube_faults: {}          # 例如 { 3: low_quality, 5: failed, 6: tube_not_found }
delay_ms: 0              # 模拟每排耗时
fail_load: false
fail_all: false          # true：analyze_row 抛 AnalyzerError
# 判读参数（算法方案第 5 节），改动后 config_version 随文件名记录
weights: [0.5, 0.3, 0.1, 0.1]   # ω1–ω4：ΔA、Δs、σ_A、σ_s，之和为 1
limits: [30, 0.15, 10, 0.05]    # 归一化上限：ΔA(%)、Δs(管长)、σ_A(%)、σ_s(管长)，达到上限时 f = 0
thresholds:
  not_gelled_max: 0.25          # Score ≤ 此值：未凝固
  fully_gelled_min: 0.85        # Score ≥ 此值：完全凝固
