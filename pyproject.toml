[project]
name = "gelinspect"
dynamic = ["version"]
description = "凝胶智检系统 / GelInspect：凝胶法细菌内毒素检测上位机软件（离线，Windows + macOS）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6-Essentials~=6.12",
    "pyqtgraph>=0.14",
    "SQLAlchemy>=2.1",
    "alembic",
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "opencv-python-headless>=4.10,<5",
    "cryptography",
    "pyhanko",
    "argon2-cffi",
    "openpyxl",
]

[project.optional-dependencies]
# 真实算法推理所需的 ONNX 运行时；骨架阶段不安装。
inference = ["onnxruntime"]

[project.scripts]
gelinspect = "gelinspect.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "mypy",
    "types-PyYAML",
    "nuitka>=4.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gelinspect/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gelinspect", "simulation"]
# 字体（OFL）、Lucide 图标（ISC）及其许可证随包发布。
artifacts = [
    "src/gelinspect/ui/assets/**/*.ttf",
    "src/gelinspect/ui/assets/**/*.svg",
    "src/gelinspect/ui/assets/**/*.txt",
    "src/gelinspect/ui/assets/**/*.png",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D"]

# D415 只识别 ASCII 句末标点，中文 docstring 使用全角“。”，故关闭。
ignore = ["D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# QSS 模板中每条规则写在一行，便于对照设计稿。
"src/gelinspect/ui/theme/stylesheet.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "simulation", "tests"]
mypy_path = "src"

# pyHanko 依赖 asn1crypto，后者没有类型标注；openpyxl 也没有随包的类型标注。
[[tool.mypy.overrides]]
module = ["asn1crypto", "asn1crypto.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "perf: 性能测试（造 10 万条审计和 1 万管结果）。默认运行，可用 -m \"not perf\" 跳过。",
    "video_perf: 视频管线 4000×3000 压测（约 40 秒）。默认跳过，设置 GELINSPECT_PERF_VIDEO=1 或 -m video_perf 运行。",
]
